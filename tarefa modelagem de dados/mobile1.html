<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="mobile1.css">
  <title>Dashboard Layout - Versão Mobile</title>
</head>
<body>

  
  <div class="mobile-app">

 
    <header class="mobile-header">
      <button type="button" class="menu-toggle" aria-label="Abrir Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <div class="header-icon"></div>
    </header>

   
    <aside class="mobile-sidebar">
    
      <div class="icon-grid">
        <div class="yellow-icon"></div>
        <div class="yellow-icon"></div>
        <div class="yellow-icon"></div>
        <div class="yellow-icon"></div>
      </div>

      
      <nav class="nav-menu">
        <div class="blue-btn"></div>
        <div class="blue-btn"></div>
        <div class="blue-btn"></div>
        <div class="blue-btn"></div>
      </nav>
    </aside>

    <main class="mobile-content">

      <section class="horizontal-scroll-container">
        <div class="yellow-chip"></div>
        <div class="yellow-chip"></div>
        <div class="yellow-chip"></div>
        <div class="yellow-chip"></div>
      </section>

     
      <section class="cards-feed">


        <article class="content-card">
          <div class="pink-box-small"></div>
          <div class="pink-box-large"></div>
        </article>

   
        <article class="content-card">
          <div class="pink-box-small"></div>
          <div class="pink-box-large"></div>
        </article>

     
        <article class="content-card">
          <div class="pink-box-small"></div>
          <div class="pink-box-large"></div>
        </article>

      
        <article class="content-card">
          <div class="pink-box-small"></div>
          <div class="pink-box-large"></div>
        </article>

      </section>

    </main>

   
    <nav class="bottom-nav">
      <div class="blue-btn-small"></div>
      <div class="blue-btn-small"></div>
      <div class="blue-btn-small"></div>
      <div class="blue-btn-small"></div>
    </nav>

  </div>

</body>
</html>
